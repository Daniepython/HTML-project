<html>
<head>
    <title>Order</title>
</head>
<body>

    <h2>Place Order</h2>
    <hr>
        Enter Name: <br>
        <input type="text" name="cname">
        <br><br>

        Phone Number: <br>
        <input type="text" name="phone">
        <br><br>

        Order Type: <br>
        <input type="radio" name="otype" value="dinein" checked> Dine In
        <input type="radio" name="otype" value="takeaway"> Takeaway
        <br><br>

        Select Item: <br>
        <select name="item">
            <option>Tea - Rs. 15</option>
            <option>Coffee - Rs. 20</option>
            <option>Samosa - Rs. 15</option>
            <option>Veg Sandwich - Rs. 35</option>
        </select>
        <br><br>

        Add-ons: <br>
        <input type="checkbox" name="extra" value="sugar"> Extra Sugar<br>
        <input type="checkbox" name="extra" value="sauce"> Extra Sauce
        <br><br>

        Instructions: <br>
        <textarea rows="3" cols="25" name="note"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
